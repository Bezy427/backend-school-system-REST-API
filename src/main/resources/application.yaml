
spring:
  application:
    name: school-system

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/school_db?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 1200
    refreshTokenExpiration: 604800
app:
  password-reset:
    new-password: ${RESET_PASSWORD}
